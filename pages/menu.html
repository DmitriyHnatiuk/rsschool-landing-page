<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" sizes="32x32" href="../favicon.png" type="image/svg+xml">

  <link rel="alternate icon" href="../favicon.png" type="image/x-icon">

  <link rel="apple-touch-icon" sizes="52x52" href="../assets/icons/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css?family=Inter" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="style.css">

  <script src="../js/theme.js" defer></script>
  <script src="../js/menu.js" type="module" defer></script>

  <title>Landing page menu</title>
  <script>
    if (localStorage.getItem('site-theme') === 'dark') {
      document.documentElement.classList.add('dark-theme');
    }
  </script>
</head>

<body>

  <header class="header">
    <input type="checkbox" id="mobile-menu-bth" class="menu__mobile--input">

    <label for="mobile-menu-bth" class="menu__mobile--btn">
      <span class="menu__mobile--icon">&nbsp;</span>
    </label>
    <span class="menu__mobile--background">&nbsp;</span>

    <div class="header__container">
      <div class="logo">
        <a href="../index.html" class="logo__icon" aria-label="Logo"></a>
      </div>
      <nav class="nav">
        <ul class="nav__list" id="navigation">
          <li><a href="../index.html#favorite">Favorite coffee</a></li>
          <li><a href="../index.html#about">About</a></li>
          <li><a href="../index.html#mobile">Mobile app</a></li>
          <li><a href="#contact">Contact us</a></li>
        </ul>

      </nav>
      <div class="header__button__container">
        <div class="theme-switcher">
          <input type="checkbox" id="theme-toggle" class="theme-switcher__input">
          <label for="theme-toggle" class="theme-switcher__label">
            <span class="theme-switcher__icon theme-switcher__icon--sun">
              &#9728;
            </span>
            <span class="theme-switcher__icon theme-switcher__icon--moon">
              &#9789;
            </span>
          </label>
        </div>

        <a href="../pages/menu.html" class="btn-menu">Menu</a>
      </div>
    </div>
  </header>

  <main>
    <section class="menu">
      <h1 class="u-text-xl menu--title">
        Behind each of our cups hides an
        <span class="u-accent">amazing surprise</span>
      </h1>

      <nav class="menu__nav">
        <ul class="menu__nav--list" id="menu-nav">
          <li class="menu__nav--item">
            <input id="coffee-btn" type="radio" name="menu" checked class="menu__nav--input">
            <label for="coffee-btn" class="menu__nav--label">
              <span class="nav-icon">&#9749;</span>
              <span class="nav-text">Coffee</span>
            </label>
          </li>
          <li class="menu__nav--item">
            <input id="tee-btn" type="radio" name="menu" class="menu__nav--input">
            <label for="tee-btn" class="menu__nav--label">
              <span class="nav-icon">&#129750;</span>
              <span class="nav-text">Tee</span>
            </label>
          </li>
          <li class="menu__nav--item">
            <input id="dessert-btn" type="radio" name="menu" class="menu__nav--input">
            <label for="dessert-btn" class="menu__nav--label">
              <span class="nav-icon">&#127856;</span>
              <span class="nav-text">Desserts</span>
            </label>
          </li>
        </ul>
      </nav>

      <div class="menu__container" id="menu-container">
        <button class="btn load--more" type="button" id="load-more">
          <span>
            &nbsp;
          </span>
        </button>
      </div>
    </section>

    <section class="modal__container is-hidden" id="modal-container">
      <span class="modal__background" id="modal-bg">&nbsp;</span>
      <div id="modal" class="modal">

      </div>
    </section>
  </main>



  <footer class="footer" id="footer">
    <div class="footer__container" id="contact">
      <div class="footer__brand">
        <div class="footer__slogan">
          <h2 class="footer__title"> Sip, Savor, Smile</h2>
          <h2 class="footer__title">
            <strong class="u-accent">It's coffee time!</strong>
          </h2>
        </div>
        <div class="footer__socials">
          <a href="https://twitter.com" target="_blank" class="footer__socials--twitter" aria-label="Twitter"></a>

          <a href="https://instagram.com" target="_blank" class="footer__socials--instagram" aria-label="Instagram"></a>

          <a href="https://facebook.com" target="_blank" class="footer__socials--facebook" aria-label="Facebook"></a>
        </div>
      </div>

      <div class="footer__contacts">
        <h3 class="footer__contacts--title">Contact us</h3>

        <div class="footer__contacts--list">
          <a href="https://maps.app.goo.gl/gk7T9Ak3BX2JQmJ17" target="_blank" class="footer__contacts--map">
            <span class="contact">8558 Green Rd., LA</span>
          </a>

          <a href="tel:+16035550123" class="footer__contacts--tel">
            <span class="contact">+1 (603) 555-0123</span>
          </a>

          <h3 class="footer__contacts--time">
            <span class="contact">Mon-Sat: 9:00-23:00</span>
          </h3>
        </div>
      </div>
    </div>
  </footer>
</body>

</html>
